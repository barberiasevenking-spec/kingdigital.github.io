<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#7928CA',
                        secondary: '#FF0080',
                        dark: '#0F172A',
                        light: '#F8FAFC',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .gradient-text {
                background: linear-gradient(90deg, #7928CA 0%, #FF0080 100%);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent !important;
            }
            .bg-gradient-principal {
                background: linear-gradient(90deg, #7928CA 0%, #FF0080 100%);
            }
        }
    </style>
</head>
<body class="font-sans text-dark bg-gradient-to-br from-light via-white to-purple-50 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-16 text-center">
        <!-- Logo de King Digital -->
        <div class="flex justify-center mb-8">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-lg bg-gradient-principal flex items-center justify-center text-white text-2xl font-bold shadow-md">
                    K
                </div>
                <div class="text-left">
                    <span class="font-bold text-2xl gradient-text">KING DIGITAL</span>
                    <p class="text-xs text-gray-500 -mt-1">Soluciones Digitales Profesionales</p>
                </div>
            </div>
        </div>

        <!-- Número grande 404 -->
        <h1 class="text-[clamp(6rem,20vw,12rem)] font-extrabold leading-none gradient-text opacity-20 m-0 p-0">
            404
        </h1>

        <!-- Título de la página -->
        <h2 class="text-[clamp(1.5rem,4vw,2.5rem)] font-bold mb-4 mt-0">¡Ups! Página no encontrada</h2>

        <!-- Texto explicativo -->
        <p class="text-gray-600 text-lg mb-8 max-w-lg mx-auto">
            La página que buscas no existe, fue movida o no está disponible en este momento.<br>
            <span class="font-semibold text-primary">King Digital</span> te ayuda a volver al camino correcto.
        </p>

        <!-- Ícono decorativo -->
        <div class="text-6xl text-primary/30 mb-8">
            <i class="fa fa-compass"></i>
        </div>

        <!-- Botón de regreso -->
        <a href="index.html" class="inline-block bg-gradient-principal hover:opacity-90 text-white px-8 py-3 rounded-lg font-semibold transition-all transform hover:scale-105 shadow-lg hover:shadow-xl no-underline">
            <i class="fa fa-home mr-2"></i> Volver al Inicio
        </a>

        <!-- Pie de página -->
        <p class="text-gray-400 text-sm mt-12 mb-0">© 2026 King Digital - Todos los derechos reservados</p>
    </div>
</body>
</html>
